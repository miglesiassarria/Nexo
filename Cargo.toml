[workspace]
members = ["crates/nexo-core", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Manuel Iglesias"]
repository = "https://github.com/miglesias/Nexo"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
